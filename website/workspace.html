<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta
      name="description"
      content="Manage your TeleRAG documents, test answers, and connect your Telegram bot."
    />
    <title>Your workspace — TeleRAG</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem("telerag-theme");
        document.documentElement.dataset.theme =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body data-page="workspace">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
